name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Install Kivy iOS tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3" kivy-ios

      - name: Build Python and Kivy
        run: toolchain build python3 kivy

      - name: Prepare clean app folder
        run: |
          mkdir -p app
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'app' \
            --exclude 'build' \
            --exclude 'dist' \
            --exclude '*-ios' \
            ./ app/
          ls -la app

      - name: Create Xcode project
        run: toolchain create brickbreaker "$GITHUB_WORKSPACE/app"

      - name: Build for real device (no signing)
        run: |
          cd brickbreaker-ios
          SCHEME=$(xcodebuild -list -project brickbreaker.xcodeproj 2>/dev/null | awk '/Build Targets:/{exit} /Schemes:/{found=1; next} found && NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')
          echo "Using scheme: $SCHEME"
          [ -z "$SCHEME" ] && { echo "No Xcode scheme found."; exit 1; }

          xcodebuild \
            -project brickbreaker.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          echo "App: $APP"
          [ -z "$APP" ] && { echo "No .app found"; exit 1; }
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qry ../brickbreaker-unsigned.ipa Payload
          ls -lh ../brickbreaker-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: brick-breaker-ipa
          path: brickbreaker-unsigned.ipa
          if-no-files-found: error
