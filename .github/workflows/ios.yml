name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Xcode
        run: xcodebuild -version

      - name: Install system dependencies
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Install Kivy iOS tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3" kivy-ios

      - name: Build Python dependencies
        run: |
          toolchain build python3 kivy

      - name: Create iOS project
        run: |
          toolchain create brickbreaker .
          ls -la brickbreaker-ios

      - name: Find Xcode scheme
        run: |
          cd brickbreaker-ios
          xcodebuild -list -project brickbreaker.xcodeproj

      - name: Build iOS Simulator project
        run: |
          cd brickbreaker-ios

          SCHEME=$(xcodebuild -list -project brickbreaker.xcodeproj 2>/dev/null | awk '/Build Targets:/{exit} /Schemes:/{found=1; next} found && NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')

          echo "Using scheme: $SCHEME"

          if [ -z "$SCHEME" ]; then
            echo "No Xcode scheme found."
            exit 1
          fi

          xcodebuild \
            -project brickbreaker.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-breaker-ios-build
          path: brickbreaker-ios/
          if-no-files-found: warn
